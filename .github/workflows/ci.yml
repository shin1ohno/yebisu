name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulator-smoke:
    if: github.ref_name != 'test/native-edit-menu-preflight-sh1-177'
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: python3 scripts/guarded.py rustup show active-toolchain
      - name: Install simulator tools
        run: brew install just xcodegen
      - name: Fetch
        run: just guarded cargo fetch --locked
      - name: Build, launch and verify simulator
        run: just guarded python3 scripts/ios/ci-smoke.py
      - name: Upload simulator smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-smoke-evidence
          path: |
            target/ios-smoke/*/
            !target/ios-smoke/build/
  check:
    if: github.ref_name != 'test/native-edit-menu-preflight-sh1-177'
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Rust
        run: python3 scripts/guarded.py rustup show active-toolchain
      - name: Install just
        run: brew install just
      - name: Fetch
        run: just guarded cargo fetch --locked
      - name: Check
        run: just check
      - name: Lint iOS
        run: just lint-ios
      - name: Test
        run: just test
      - name: Commit subjects
        if: github.event_name == 'pull_request'
        run: python3 scripts/release/check-commit-messages.py range origin/main..HEAD

  edit-menu-preflight:
    if: github.ref_name == 'test/native-edit-menu-preflight-sh1-177'
    runs-on: macos-26
    timeout-minutes: 40
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: shin1ohno/herdr-uikit
          ref: 7966c34a1ad29a5d7e241c558f16857f9f7aa047
          path: sdk-probe
          persist-credentials: false
      - name: Install tools
        run: |
          brew install just xcodegen
          just guarded rustup show active-toolchain
      - name: Record source and apply uncommitted preflight patch
        run: |
          git rev-parse HEAD
          git -C sdk-probe rev-parse HEAD
          python3 - <<'PYCODE'
          from pathlib import Path
          manifest = Path('Cargo.toml')
          with manifest.open('a') as output:
              output.write('\n[patch."https://github.com/shin1ohno/herdr-uikit"]\nherdr-uikit = { path = "sdk-probe" }\n')
          PYCODE
          just guarded cargo update -p herdr-uikit
      - name: Check format and repository rules
        run: just check
      - name: Probe real Simulator menus
        run: just guarded python3 scripts/ios/sh1-152-preflight.py
      - name: Upload preflight observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edit-menu-preflight
          path: |
            target/ios-sh1-152-preflight/
            target/disk.log
