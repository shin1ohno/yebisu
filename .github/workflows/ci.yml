name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  edit-menu:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: python3 scripts/guarded.py rustup show active-toolchain
      - name: Install simulator tools
        run: brew install just xcodegen
      - name: Fetch
        run: just guarded cargo fetch --locked
      - name: Native edit menu receiving-system checks
        run: just guarded python3 scripts/ios/ci-sh1-152.py
      - name: Upload menu receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edit-menu-evidence
          path: |
            target/ios-sh1-152/
            target/ios-sh1-153/
            target/ios-p8-native/
            target/ios-selection-settings/
            target/disk.log
  simulator-smoke:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: python3 scripts/guarded.py rustup show active-toolchain
      - name: Install simulator tools
        run: brew install just xcodegen
      - name: Fetch
        run: just guarded cargo fetch --locked
      - name: Build, launch and verify simulator
        run: just guarded python3 scripts/ios/ci-smoke.py --p9
      - name: Upload simulator smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-smoke-evidence
          path: |
            target/ios-smoke/*/
            target/ios-p9/*/
            !target/ios-smoke/build/
  check:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Rust
        run: python3 scripts/guarded.py rustup show active-toolchain
      - name: Install just
        run: brew install just
      - name: Fetch
        run: just guarded cargo fetch --locked
      - name: Check
        run: just check
      - name: Lint iOS
        run: just lint-ios
      - name: Test
        run: just test
      - name: Commit subjects
        if: github.event_name == 'pull_request'
        run: python3 scripts/release/check-commit-messages.py range origin/main..HEAD
