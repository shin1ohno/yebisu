name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *' # 03:00 JST
permissions:
  contents: read
# Superseded pull_request runs are cancelled; main pushes are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'nightly' || 'on-demand' }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Select PR jobs from the whole diff against the merge base. On a main push,
  # only reuse complete PR jobs that tested the same tree. The nightly run
  # bypasses both decisions.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      check: ${{ steps.filter.outputs.check }}
      simulator-smoke: ${{ steps.filter.outputs.simulator-smoke }}
      edit-menu: ${{ steps.filter.outputs.edit-menu }}
      layout-smoke: ${{ steps.filter.outputs.layout-smoke }}
      layout-mutations: ${{ steps.filter.outputs.layout-mutations }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Find complete PR jobs for this main tree
        id: reuse
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import re
          import subprocess

          MACOS_JOBS = ("check", "simulator-smoke", "edit-menu", "layout-smoke")
          SHA = re.compile(r"[0-9a-f]{40}")
          VERIFIED_CHECKOUT = re.compile(r"Verify tested commit ([0-9a-f]{40})")

          def api(path):
              try:
                  response = subprocess.run(
                      ["gh", "api", path], check=True, capture_output=True, text=True, timeout=15
                  )
              except subprocess.CalledProcessError as error:
                  detail = (error.stderr or "").strip() or f"gh exited {error.returncode}"
                  raise ValueError(f"{path}: {detail}") from None
              return json.loads(response.stdout)

          def require(condition, reason):
              if not condition:
                  raise ValueError(reason)

          def tree(repo, sha):
              require(SHA.fullmatch(sha), "commit SHA is missing or invalid")
              commit = api(f"{repo}/git/commits/{sha}")
              tree_sha = commit["tree"]["sha"]
              require(commit["sha"] == sha and SHA.fullmatch(tree_sha), "invalid Git commit evidence")
              return tree_sha

          def complete(job, run_id, head):
              steps = job["steps"]
              return (
                  job["run_id"] == run_id and job["head_sha"] == head
                  and job["status"] == "completed" and job["conclusion"] == "success"
                  and job["runner_id"] > 0 and steps
                  and steps[0]["name"] == "Set up job" and steps[-1]["name"] == "Complete job"
                  and all(step["status"] == "completed" and step["conclusion"] == "success" for step in steps)
              )

          def reusable_jobs(repository, sha):
              repo = f"repos/{repository}"
              main_tree = tree(repo, sha)
              prs = api(f"{repo}/commits/{sha}/pulls?per_page=100")
              require(len(prs) == 1, "main commit has no unique associated PR")
              pr = prs[0]
              require(
                  pr["base"]["repo"]["full_name"] == repository and pr["base"]["ref"] == "main"
                  and pr["merged_at"] and pr["merge_commit_sha"] == sha
                  and type(pr["number"]) is int and pr["number"] > 0,
                  "associated PR was not merged into main at this commit",
              )
              head = pr["head"]["sha"]
              require(main_tree == tree(repo, head), "main and PR head trees differ")

              runs = api(f"{repo}/actions/workflows/ci.yml/runs?head_sha={head}&event=pull_request&per_page=100")
              require(runs["total_count"] == len(runs["workflow_runs"]) == 1, "PR head has no unique CI run")
              run = runs["workflow_runs"][0]
              require(
                  run["event"] == "pull_request" and run["head_sha"] == head
                  and str(run["path"]).split("@", 1)[0] == ".github/workflows/ci.yml"
                  and run["head_branch"] == pr["head"]["ref"]
                  and run["head_repository"]["full_name"] == pr["head"]["repo"]["full_name"]
                  and run["created_at"] and run["created_at"] <= pr["merged_at"]
                  and run["status"] == "completed"
                  and all(ref["number"] == pr["number"] for ref in run["pull_requests"]),
                  "CI run does not identify a completed run for this PR",
              )
              run_id, attempt = run["id"], run["run_attempt"]
              require(type(run_id) is int and type(attempt) is int and min(run_id, attempt) > 0, "invalid run or attempt ID")
              result = api(f"{repo}/actions/runs/{run_id}/attempts/{attempt}/jobs?per_page=100")
              jobs = result["jobs"]
              require(result["total_count"] == len(jobs), "incomplete job listing")

              reused = {}
              for name in MACOS_JOBS:
                  matches = [job for job in jobs if job["name"] == name]
                  if len(matches) != 1 or not complete(matches[0], run_id, head):
                      continue
                  job = matches[0]
                  if name == "check" and not any(
                      step["name"] == "Layout geometry source mutations" for step in job["steps"]
                  ):
                      continue
                  job_id = job["id"]
                  require(type(job_id) is int and job_id > 0, "invalid job ID")
                  if name == "edit-menu":
                      # The job's head_sha is the PR head. Its checkout verification
                      # step records the synthetic merge commit in the job metadata.
                      commits = [
                          match[1] for step in job["steps"]
                          if (match := VERIFIED_CHECKOUT.fullmatch(step["name"]))
                      ]
                      if len(commits) != 1 or tree(repo, commits[0]) != main_tree:
                          continue
                  reused[name] = f"https://github.com/{repository}/actions/runs/{run_id}/job/{job_id}"
              return pr["number"], main_tree, reused

          def main():
              try:
                  pr, tree_sha, reused = reusable_jobs(os.environ["GITHUB_REPOSITORY"], os.environ["GITHUB_SHA"])
              except (KeyError, TypeError, ValueError, subprocess.SubprocessError, OSError) as error:
                  reason = str(error)
                  if token := os.environ.get("GH_TOKEN"):
                      reason = reason.replace(token, "[redacted]")
                  reason = " ".join(reason.split())
                  reason = "".join(char for char in reason if char.isprintable())
                  message = f"PR evidence unavailable ({reason}); running every macOS job."
                  print(message)
                  with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
                      print(f"    {message}", file=summary)
                  return
              if not reused:
                  print("No macOS job passed every step on the matching PR tree.")
                  return
              with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                  print(f"jobs={' '.join(reused)}", file=output)
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
                  print(f"### macOS jobs already verified on PR #{pr}\n", file=summary)
                  print(f"Matching tree: `{tree_sha}`\n", file=summary)
                  for name, url in reused.items():
                      print(f"{name}: skipped, all steps passed in {url} (tree {tree_sha})")
                      print(f"- [{name}]({url})", file=summary)

          if __name__ == "__main__":
              main()
          PYTHON
      - name: Select jobs by changed paths
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SKIPPED_JOBS: ${{ steps.reuse.outcome == 'success' && steps.reuse.outputs.jobs || '' }}
        run: |
          set -euo pipefail
          changed="$RUNNER_TEMP/changed.txt"
          all=false
          diff_available=false
          if [[ "$EVENT_NAME" != pull_request ]]; then
            all=true
          elif ! git diff --no-renames --name-only "$BASE_SHA...$HEAD_SHA" > "$changed"; then
            echo "Could not diff $BASE_SHA...$HEAD_SHA; running PR jobs without path filters."
            all=true
          else
            diff_available=true
            echo "Changed files in the pull request:"
            sed 's/^/  /' "$changed"
          fi
          # Everything each job compiles or bundles: the crate, its toolchain
          # and lockfile, the fonts bundle.sh copies, the just entry point,
          # the disk guard, and the bundling scripts. An edit to this workflow
          # selects every macOS job that can run on a PR.
          build='^(\.github/workflows/ci\.yml$|crates/|\.cargo/|assets/|Cargo\.toml$|Cargo\.lock$|rust-toolchain\.toml$|justfile$|scripts/guarded\.py$|scripts/ios/(bundle\.sh|Info\.plist|lib\.sh)$)'
          # check also runs clippy (clippy.toml), the repository checks, every
          # unit test under scripts/, the provenance register, and reads
          # testflight.yml in a test.
          check="$build|"'^(clippy\.toml$|scripts/|PROVENANCE\.tsv$|NOTICE$|\.github/workflows/testflight\.yml$)'
          # simulator-smoke: ci-smoke.py with --p9, then p12-ci.py.
          smoke="$build|"'^scripts/ios/(sim\.sh|screenshot-color\.py|ci-smoke\.py|smoke-check\.py|smoke_oracle\.py|live_jsonl\.py|p9-check\.py|p12-ci\.py|p12-check\.py|p12-oracle\.py|sim_ready\.py|resend_budget\.py|smoke-qa/|p12-qa/)'
          # edit-menu is narrower than $build:
          # a pull request runs it only when a file the four checks drive
          # changes, so a change to other crates/yebisu code (search, hosts,
          # notifications, ...) skips it. The files, and why each is listed:
          #   build harness     every check runs scripts/ios/bundle.sh, which
          #                     cargo-builds the crate (Cargo.toml and Cargo.lock
          #                     pin the SDK and GPUI, rust-toolchain.toml and
          #                     .cargo/ the compiler, justfile and guarded.py
          #                     the `just guarded` wrapper) and copies assets/,
          #                     scripts/ios/Info.plist and lib.sh (ios_sim_boot)
          #   ci-smoke.py       ci-sh1-152.py:10 loads it for select_template
          #   ci-sh1-152.py     the driver the job runs
          #   the four checks   sh1-152-check.py, sh1-153-check.py,
          #                     p8-native-check.py, selection-settings-check.py
          #   sh1_152_*.py      oracles that sh1-152-check.py:12-20 loads
          #   smoke-qa/         the XCTest bundle all four xcodebuild test runs
          #                     build (Tests/EditMenuQA.swift for SH1-152,
          #                     Tests/SmokeQA.swift for the other three, project.yml)
          #   crates/yebisu     the app code the checks drive, found from the
          #                     YEBISU_* variables the XCTest sets:
          #     Cargo.toml        features and dependencies of the binary
          #     main.rs, app.rs   module list; app.rs:119,378,410 read
          #                       YEBISU_SMOKE_OBSERVE/TERMINAL_QA/CORE_QA
          #     edit_menu*.rs     the edit menu and its QA scenes
          #                       (edit_menu_qa.rs:12 YEBISU_EDIT_MENU_QA,
          #                       edit_menu_qa_sh1_152.rs:24 YEBISU_SH1_152_CASE)
          #     native_menus.rs, native_edit_qa.rs, native_observer_qa.rs
          #                       the native menu and text input that
          #                       p8-native-check.py drives (YEBISU_NATIVE_QA)
          #     terminal_controls.rs, terminal_input.rs, terminal_view.rs,
          #     input.rs, input_geometry.rs
          #                       the terminal surface the menu opens on
          #                       (terminal_controls.rs:163, terminal_view.rs:124)
          #     mock_peer.rs, core_mock.rs, core_view.rs, core_paste_view.rs
          #                       the mock peer and core the SH1-152 cases run
          #                       against (mock_peer.rs:13, core_mock.rs:255)
          #     observation*      the records the oracles read (observation.rs:41-51,100)
          #     handoff.rs, handoff_view.rs
          #                       the selection strip (handoff_view.rs:321-331)
          #     settings*         selection settings that selection-settings-check.py
          #                       saves and reloads (settings_view.rs:17,71,
          #                       settings/store.rs, settings_sheet/view.rs:271)
          #   Files and directories added after review (each driven by a check):
          #     fixtures/         endpoint-*.json: mock_peer.rs:7-8 include_str!s them
          #                       and sends them to the app in every check (whole
          #                       directory, it holds only those two files)
          #     handoff_clipboard.rs
          #                       Paste reads the clipboard here (handoff_view.rs:116)
          #                       for SH1-152 and SH1-153; iOS reads it (:3-4)
          #     handoff_ticket.rs core paste ticket (handoff.rs:50-51)
          #     core.rs, core/    core::Session and Command behind the SH1-152 core
          #                       cases (core_view.rs:69, edit_menu_qa_sh1_152.rs:109);
          #                       whole directory: every file in it is on that path
          #     core_mock/        paste.rs is the Probe core_mock.rs:34-61 uses; a
          #                       directory is safer than naming it, as the next
          #                       child module would be missed
          #     live.rs, live/    terminal_input.rs:26 live::coherent decides whether
          #                       any input reaches the wire (all four checks)
          #     notifications/preferences.rs
          #                       Policy::encode writes the saved `notifications` that
          #                       selection-settings-check.py compares exactly
          #     theme_picker/     reads and writes the saved `theme` the same check
          #                       compares (settings/store.rs:38,67)
          #     animation_qa*     app.rs samples it every second when YEBISU_CORE_QA
          #                       is set, which the SH1-152 core cases set
          #     actions.rs        terminal_controls.rs:222 shortcut_candidate runs on
          #                       every key; native_menus.rs builds its rows from it
          #     settings_pages/   settings_sheet/view.rs:244-285 renders fonts and
          #                       keyboard; they set terminal_font_family and the
          #                       terminal_priority p8-native-check.py uses
          #     mock_commands.rs, mock_notifications.rs
          #                       mock_peer.rs:229,327 call them while it answers
          #     link.rs           terminal_input.rs HeldInput: the key events
          #                       sh1-153 and p8-native check on the wire
          #     theme.rs          terminal_view.rs applies it to the painter
          #     board.rs          native_menus.rs builds its menu scope from
          #                       board::snapshot
          #     i18n.rs           actions.rs resolves the menu row labels through it
          #   Added with SH1-156 (PR 70, which also lands PR 62):
          #     sh1-156-check.py  the fifth check ci-sh1-152.py runs
          #     sh1_156_qa.rs     its fixture (YEBISU_SH1_156_QA)
          #     input_retirement.rs, native_retirement.rs
          #                       every input transition ends in a retirement
          #                       request (input_retirement.rs:70-78), so every
          #                       check's key, tap and Select path runs them
          #   Added with SH1-157 Integration 1:
          #     shell.rs, shell/  terminal_view.rs wraps the terminal in
          #                       shell_frame and app.rs draws the Hosts sheet and
          #                       the first-run frame on every screen
          #     layout.rs, layout/
          #                       settings_sheet/view.rs and shell/ size their
          #                       regions from it
          #   Added with fix/observation-drop (a lost record is never silent):
          #     qa_stderr.rs      copies the app's stderr to Documents/app-stderr.log
          #                       in every QA launch (app.rs run)
          #     app_stderr.py     sh1-152-check.py collects that log and fails on
          #                       a lost-record line
          #     live_jsonl.py     every check reads the app's records through it,
          #                       and it fails on an observation-dropped record
          #   Added with UI test redesign S4 (the five checks press QA identifiers and
          #   wait on qa.state, YEBISU_QA_AX):
          #     qa_ax*.rs         the QA accessibility layer, its identifiers, the
          #                       UIKit view, the root fields, the counters and
          #                       the mock peers' receipts (qa_ax_peer.rs)
          #   Added with #138 (sidebar search):
          #     search-check.py, test_search_check.py
          #                       search-check.py drives the native search panel
          #                       (just ios-search); shell/search*.rs is under shell/
          #   find and find_view (P13 search) stay out, as
          #   test_find_search_change_skips_it decides.
          # A new module is not picked up by this list. test_ci_sh1_152.py fails
          # for any module in main.rs that is neither matched here nor in its
          # reviewed exclusion list, so adding one forces a decision.
          # A PR that touches only docs/, P12 files (scripts/ios/p12-*, p12-qa/),
          # other scripts/ios files or other crates/yebisu code (find, hosts,
          # notifications, ...) skips edit-menu.
          menu='^(\.github/workflows/ci\.yml$|Cargo\.toml$|Cargo\.lock$|rust-toolchain\.toml$|\.cargo/|assets/|justfile$|scripts/guarded\.py$|scripts/ios/(bundle\.sh|Info\.plist|lib\.sh|live_jsonl\.py|app_stderr\.py|ci-smoke\.py|ci-sh1-152\.py|sh1-152-check\.py|sh1-153-check\.py|p8-native-check\.py|selection-settings-check\.py|sh1-156-check\.py|search-check\.py|test_search_check\.py|sh1_152_[a-z]+\.py|sim_ready\.py|resend_budget\.py|smoke-qa/)|crates/yebisu/(Cargo\.toml$|fixtures/|src/((main|app|native_menus|native_edit_qa|native_observer_qa|terminal_controls|terminal_input|terminal_view|terminal_wheel|input|input_geometry|mock_peer|core|core_mock|core_view|core_paste_view|handoff|handoff_view|handoff_clipboard|handoff_ticket|live|actions|animation_qa|mock_commands|mock_notifications|link|theme|board|i18n|settings|settings_view|settings_sheet|observation|qa_stderr|qa_ax|qa_ax_core|qa_ax_ids|qa_ax_keys|qa_ax_layer|qa_ax_native|qa_ax_peer|qa_ax_root|diagnostics|qa_ax_input|input_retirement|native_retirement|sh1_156_qa|layout|shell|edit_menu[a-z0-9_]*)\.rs$|notifications/preferences\.rs$|(core|core_mock|live|animation_qa|settings|settings_pages|settings_sheet|theme_picker|observation|layout|shell)/)))'
          # Plan section 4.2: mutation targets, their tests and build inputs.
          mutations='^(crates/yebisu/src/(layout|shell|settings|settings_pages|core/screen|terminal_input)(\.rs$|/|_tests)|scripts/ios/layout-mutations\.py$|scripts/guarded\.py$|\.github/workflows/ci\.yml$|Cargo\.(lock|toml)$|crates/yebisu/Cargo\.toml$|rust-toolchain\.toml$|\.cargo/|justfile$)'
          emit() {
            echo "$1=$2" >> "$GITHUB_OUTPUT"
            if [[ "$2" == true ]]; then
              echo "$1: run"
            else
              echo "$1: skip"
            fi
          }
          decide() {
            if [[ "$EVENT_NAME" == push && " $SKIPPED_JOBS " == *" $1 "* ]]; then
              emit "$1" false
            elif [[ "$all" == true ]] || grep -Eq "$2" "$changed"; then
              emit "$1" true
            else
              emit "$1" false
            fi
          }
          decide check "$check"
          decide simulator-smoke "$smoke"
          decide edit-menu "$menu"
          if [[ "$EVENT_NAME" == pull_request ]]; then
            emit layout-smoke false
            if [[ "$diff_available" == true ]] && grep -Eq "$mutations" "$changed"; then
              emit layout-mutations true
            else
              emit layout-mutations false
            fi
          else
            decide layout-smoke ''
            emit layout-mutations true
          fi
  # The release changelog uses commit subjects. Check every PR, including ones
  # with no macOS jobs, and the commits introduced by the main tip at night.
  commit-subjects:
    if: github.event_name == 'pull_request' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Commit subjects
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          range=origin/main..HEAD
          if [[ "$EVENT_NAME" == schedule ]]; then
            range=HEAD^..HEAD
          fi
          python3 scripts/release/check-commit-messages.py range "$range"
  edit-menu:
    needs: changes
    if: needs.changes.outputs.edit-menu == 'true'
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify tested commit ${{ github.sha }}
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install pinned Rust
        run: python3 scripts/guarded.py rustup show active-toolchain
      # Cargo cache, the same two steps in every job that compiles Rust. It holds
      # the registry and git sources `cargo fetch` downloads and this job's own
      # compiled dependencies (deps/, build/ and .fingerprint/ of each target
      # directory the job's cargo commands write), so the job compiles only what
      # changed. Nothing else under target/ is kept: no .app bundle (bundle.sh
      # writes it beside the executable, outside deps/), no Simulator, XCTest or
      # evidence directory, no signing material (CI has none; testflight.yml has
      # its own isolated target directory and no cache). The key names the runner,
      # this job, the toolchain, the Xcode that provides the iOS SDK and linker,
      # Cargo.lock, and the manifests and cargo config that set profiles and
      # features. A miss falls back only to an entry of the same job, toolchain
      # and Xcode; an exact hit is not saved again, so a lockfile or manifest
      # change makes one new entry per job. actions/cache only warns when the
      # service fails and fail-on-cache-miss stays off, so neither a miss nor a
      # cache error fails the job. The step runs after the guarded toolchain
      # install, and every fetch and build still runs through `just guarded`.
      - name: Cargo cache key
        id: cargo-cache-key
        run: echo "xcode=$({ xcodebuild -version || echo unknown; } | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/debug/deps/
            target/debug/build/
            target/debug/.fingerprint/
            target/aarch64-apple-ios/debug/deps/
            target/aarch64-apple-ios/debug/build/
            target/aarch64-apple-ios/debug/.fingerprint/
            target/aarch64-apple-ios-sim/debug/deps/
            target/aarch64-apple-ios-sim/debug/build/
            target/aarch64-apple-ios-sim/debug/.fingerprint/
          key: cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('rust-toolchain.toml') }}-xcode-${{ steps.cargo-cache-key.outputs.xcode }}-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('Cargo.toml', 'crates/*/Cargo.toml', '.cargo/config.toml') }}
          restore-keys: |
            cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('rust-toolchain.toml') }}-xcode-${{ steps.cargo-cache-key.outputs.xcode }}-
      - name: Install simulator tools
        run: brew install just xcodegen
      - name: Fetch
        run: just guarded cargo fetch --locked
      - name: Native edit menu receiving-system checks
        run: just guarded python3 scripts/ios/ci-sh1-152.py
      # Issue #142 stage 4 (Owner decision 5): more than 3 proven resends in this job fail it.
      - name: Simulator input resend budget
        if: always()
        run: python3 scripts/ios/resend_budget.py judge target/sim-resends.jsonl
      - name: Upload menu receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edit-menu-evidence
          path: |
            target/ios-sh1-152/
            target/ios-sh1-153/
            target/ios-p8-native/
            target/ios-selection-settings/
            target/ios-sh1-156/
            target/sim-resends.jsonl
            target/disk.log
  simulator-smoke:
    needs: changes
    if: needs.changes.outputs.simulator-smoke == 'true'
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install pinned Rust
        run: python3 scripts/guarded.py rustup show active-toolchain
      # Cargo cache: the same two steps as edit-menu (see the comment there).
      - name: Cargo cache key
        id: cargo-cache-key
        run: echo "xcode=$({ xcodebuild -version || echo unknown; } | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/debug/deps/
            target/debug/build/
            target/debug/.fingerprint/
            target/aarch64-apple-ios/debug/deps/
            target/aarch64-apple-ios/debug/build/
            target/aarch64-apple-ios/debug/.fingerprint/
            target/aarch64-apple-ios-sim/debug/deps/
            target/aarch64-apple-ios-sim/debug/build/
            target/aarch64-apple-ios-sim/debug/.fingerprint/
          key: cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('rust-toolchain.toml') }}-xcode-${{ steps.cargo-cache-key.outputs.xcode }}-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('Cargo.toml', 'crates/*/Cargo.toml', '.cargo/config.toml') }}
          restore-keys: |
            cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('rust-toolchain.toml') }}-xcode-${{ steps.cargo-cache-key.outputs.xcode }}-
      - name: Install simulator tools
        run: brew install just xcodegen
      - name: Fetch
        run: just guarded cargo fetch --locked
      - name: Build, launch and verify simulator
        run: just guarded python3 scripts/ios/ci-smoke.py --p9
      - name: Verify installed keyless native menus
        run: just guarded python3 scripts/ios/p12-ci.py
      # Issue #142 stage 4 (Owner decision 5): more than 3 proven resends in this job fail it.
      - name: Simulator input resend budget
        if: always()
        run: python3 scripts/ios/resend_budget.py judge target/sim-resends.jsonl
      - name: Upload native menu evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p12-native-menu-evidence
          path: target/p12-evidence/
      - name: Upload simulator smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-smoke-evidence
          path: |
            target/ios-smoke/*/
            target/ios-p9/*/
            target/sim-resends.jsonl
            !target/ios-smoke/build/
  check:
    needs: changes
    if: needs.changes.outputs.check == 'true'
    runs-on: macos-26
    # 32-33 min with 32 layout mutations (PR 73); run 44276079121 reached 40 min at
    # 33 of 35 (layout-mutations alone took 22 min), so 40 left no room.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install pinned Rust
        run: python3 scripts/guarded.py rustup show active-toolchain
      # Cargo cache: the same two steps as edit-menu (see the comment there).
      - name: Cargo cache key
        id: cargo-cache-key
        run: echo "xcode=$({ xcodebuild -version || echo unknown; } | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/debug/deps/
            target/debug/build/
            target/debug/.fingerprint/
            target/aarch64-apple-ios/debug/deps/
            target/aarch64-apple-ios/debug/build/
            target/aarch64-apple-ios/debug/.fingerprint/
            target/aarch64-apple-ios-sim/debug/deps/
            target/aarch64-apple-ios-sim/debug/build/
            target/aarch64-apple-ios-sim/debug/.fingerprint/
          key: cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('rust-toolchain.toml') }}-xcode-${{ steps.cargo-cache-key.outputs.xcode }}-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('Cargo.toml', 'crates/*/Cargo.toml', '.cargo/config.toml') }}
          restore-keys: |
            cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('rust-toolchain.toml') }}-xcode-${{ steps.cargo-cache-key.outputs.xcode }}-
      - name: Install just
        run: brew install just
      - name: Fetch
        run: just guarded cargo fetch --locked
      - name: Check
        run: just check
      - name: Lint iOS
        run: just lint-ios
      - name: Test
        run: just test
      # Every QA identifier a Swift UI test presses is a constant the app marks
      # (UI test redesign S6 replaced the SmokeQA label check: no test reads text
      # off the screen to find a control), so a renamed or unmarked control fails
      # here, not on a Simulator.
      - name: QA identifiers
        run: python3 scripts/ios/qa-ax-ids-check.py
      - name: Native menu source mutations
        run: python3 scripts/ios/p12-mutations.py
      - name: Upload mutation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p12-mutation-evidence
          path: target/p12-mutations/
      - name: Layout geometry source mutations
        if: needs.changes.outputs.layout-mutations == 'true'
        run: python3 scripts/ios/layout-mutations.py
      - name: Upload layout mutation evidence
        if: always() && needs.changes.outputs.layout-mutations == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: layout-mutation-evidence
          path: target/layout-mutations/
  # The Simulator checks that only the Mac mini ran (plan section 8.1): P2 keys,
  # P3 terminal, P10 settings, one after another on one disposable Simulator.
  # Each check's wall time is printed and uploaded in layout-smoke-evidence
  # (target/ios-layout-smoke/durations.json) to measure the 60-minute budget.
  layout-smoke:
    needs: changes
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.changes.outputs.layout-smoke == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install pinned Rust
        run: python3 scripts/guarded.py rustup show active-toolchain
      # Cargo cache: the same two steps as edit-menu (see the comment there).
      - name: Cargo cache key
        id: cargo-cache-key
        run: echo "xcode=$({ xcodebuild -version || echo unknown; } | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/debug/deps/
            target/debug/build/
            target/debug/.fingerprint/
            target/aarch64-apple-ios/debug/deps/
            target/aarch64-apple-ios/debug/build/
            target/aarch64-apple-ios/debug/.fingerprint/
            target/aarch64-apple-ios-sim/debug/deps/
            target/aarch64-apple-ios-sim/debug/build/
            target/aarch64-apple-ios-sim/debug/.fingerprint/
          key: cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('rust-toolchain.toml') }}-xcode-${{ steps.cargo-cache-key.outputs.xcode }}-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('Cargo.toml', 'crates/*/Cargo.toml', '.cargo/config.toml') }}
          restore-keys: |
            cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('rust-toolchain.toml') }}-xcode-${{ steps.cargo-cache-key.outputs.xcode }}-
      - name: Install simulator tools
        run: brew install just xcodegen
      - name: Fetch
        run: just guarded cargo fetch --locked
      - name: Layout smoke receiving-system checks
        run: just guarded python3 scripts/ios/ci-layout-smoke.py
      - name: Upload layout smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layout-smoke-evidence
          path: |
            target/ios-layout-smoke/
            target/ios-p2/
            target/ios-p3/
            target/ios-p10/
            target/disk.log
