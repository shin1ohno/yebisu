name: TestFlight
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: testflight
  cancel-in-progress: false
jobs:
  testflight:
    if: >-
      github.repository == 'shin1ohno/yebisu' &&
      (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    environment: testflight
    runs-on: macos-26
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '1'
    steps:
      - name: Set job-private build paths
        run: |
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/yebisu-target" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a revision on main
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Validate environment secrets and prepare private files
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: python3 -I -B scripts/ios/testflight-secrets.py
      - name: Record Xcode and SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun altool --help upload-package > "$RUNNER_TEMP/altool-upload-help.txt" 2>&1
          grep -q -- '--p8-file-path' "$RUNNER_TEMP/altool-upload-help.txt"
      - name: Install pinned Rust
        run: python3 scripts/guarded.py rustup show active-toolchain
      - name: Fetch
        run: python3 scripts/guarded.py cargo fetch --locked
      - name: Build release device bundle
        run: python3 scripts/guarded.py python3 -I -B scripts/ios/distribution.py build
      - name: Sign and package for TestFlight
        env:
          IOS_P12_FILE: ${{ runner.temp }}/yebisu-testflight/distribution.p12
          IOS_PROFILE_FILE: ${{ runner.temp }}/yebisu-testflight/app.mobileprovision
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          python3 -I -B scripts/ios/distribution.py package \
            --app "$CARGO_TARGET_DIR/aarch64-apple-ios/release/yebisu.app" \
            --output "$RUNNER_TEMP/yebisu-testflight/yebisu.ipa" \
            --build-number "$GITHUB_RUN_NUMBER" --method testflight
      - name: Upload to App Store Connect
        env:
          ASC_KEY_FILE: ${{ runner.temp }}/yebisu-testflight/AuthKey.p8
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
        run: |
          python3 -I -B scripts/ios/distribution.py upload \
            --ipa "$RUNNER_TEMP/yebisu-testflight/yebisu.ipa"
          echo 'Upload tool accepted the IPA. Check ASC processing and tester delivery separately.' >> "$GITHUB_STEP_SUMMARY"
      - name: Remove private files
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/yebisu-testflight"
