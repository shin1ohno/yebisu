[package]
name = "yebisu"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
thiserror.workspace = true
herdr-ssh.workspace = true
sheprd-client.workspace = true
sheprd-core-client.workspace = true
sheprd-backend.workspace = true
sheprd-commands.workspace = true
sheprd-i18n.workspace = true
serde_json.workspace = true
unicode-width.workspace = true
tracing.workspace = true
image.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(target_os = "ios")'.dependencies]
gpui.workspace = true
herdr-uikit.workspace = true
rodio = { version = "0.22.2", default-features = false, features = ["playback", "symphonia-mp3", "tracing"] }
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSArray", "NSData", "NSString", "NSDictionary", "std"] }
objc2-ui-kit = { version = "0.3.2", default-features = false, features = ["UIPasteboard", "std"] }

[dev-dependencies]
sheprd-client = { workspace = true, features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }

[target.'cfg(target_os = "ios")'.dev-dependencies]
herdr-uikit = { workspace = true, features = ["test-support"] }
