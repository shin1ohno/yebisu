[package]
name = "yebisu"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
test-support = ["herdr-uikit/test-support", "dep:dispatch2", "dep:libc"]
p13-native-probe = ["herdr-uikit/test-support"]

[lints]
workspace = true

[dependencies]
base64.workspace = true
thiserror.workspace = true
herdr-ssh.workspace = true
sheprd-client.workspace = true
sheprd-core-client.workspace = true
sheprd-backend.workspace = true
sheprd-commands.workspace = true
sheprd-i18n.workspace = true
serde_json.workspace = true
unicode-width.workspace = true
tracing.workspace = true
toml.workspace = true
image.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# The QA layer's pasteboard read-back digest (qa_ax_keys.rs); herdr-ssh already
# builds this version for every target, so no new crate is compiled.
sha2 = "0.11"

[target.'cfg(target_os = "ios")'.dependencies]
gpui.workspace = true
# Named only to match the SDK's typed device-key errors in key_ops/provider.rs.
sheprd-credentials.workspace = true
herdr-uikit.workspace = true
# Polls herdr-uikit's NativeSearchEvents (a futures::Stream) in shell/search.rs;
# the same version and features herdr-uikit already builds.
futures = { version = "0.3.34", default-features = false, features = ["std"] }
rodio = { version = "0.22.2", default-features = false, features = ["playback", "symphonia-mp3", "tracing"] }
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSArray", "NSData", "NSString", "NSDictionary", "std"] }
objc2-ui-kit = { version = "0.3.2", default-features = false, features = ["UIApplication", "UICommand", "UIEditMenuInteraction", "UIMenu", "UIMenuElement", "UIPasteboard", "std"] }

[target.'cfg(all(target_os = "ios", target_abi = "sim"))'.dependencies]
# The QA layer finds the UIWindow of the publishing GPUI window from its
# UIKit view (qa_ax_layer.rs, `native_view`); GPUI already builds this version.
raw-window-handle = "0.6.2"
dispatch2 = { version = "0.3.1", default-features = false, features = ["objc2", "std"], optional = true }
libc = { version = "0.2", optional = true }

[dev-dependencies]
sheprd-client = { workspace = true, features = ["test-support"] }
sheprd-commands = { workspace = true, features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
# The fork emulator, already built through sheprd-core-client: the pin test
# in core/screen_tests/wrap.rs feeds it the Herdr 2 fixture (#141).
sheprd-terminal.workspace = true

[target.'cfg(target_os = "ios")'.dev-dependencies]
herdr-uikit = { workspace = true, features = ["test-support"] }
