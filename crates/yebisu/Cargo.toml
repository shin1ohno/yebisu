[package]
name = "yebisu"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
test-support = ["herdr-uikit/test-support", "dep:dispatch2", "dep:libc"]

[lints]
workspace = true

[dependencies]
thiserror.workspace = true
herdr-ssh.workspace = true
sheprd-client.workspace = true
sheprd-core-client.workspace = true
sheprd-backend.workspace = true
sheprd-commands.workspace = true
sheprd-i18n.workspace = true
serde_json.workspace = true
unicode-width.workspace = true
tracing.workspace = true
image.workspace = true

[target.'cfg(target_os = "ios")'.dependencies]
gpui.workspace = true
herdr-uikit.workspace = true
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSArray", "NSData", "NSString", "NSDictionary", "std"] }
objc2-ui-kit = { version = "0.3.2", default-features = false, features = ["UIPasteboard", "std"] }

[target.'cfg(all(target_os = "ios", target_abi = "sim"))'.dependencies]
dispatch2 = { version = "0.3.1", default-features = false, features = ["objc2", "std"], optional = true }
libc = { version = "0.2", optional = true }

[dev-dependencies]
sheprd-client = { workspace = true, features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
