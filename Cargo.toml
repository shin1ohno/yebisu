[workspace]
members = ["crates/yebisu"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.99"
version = "0.1.1"

[workspace.dependencies]
base64 = "0.23.1"
gpui = { package = "gpui-pre", version = "=0.3.12" }
herdr-uikit = { git = "https://github.com/shin1ohno/herdr-uikit", rev = "b488c1856e0318878248afc5b1ce4e32e40f5e5c" }
"herdr-ssh" = { "git" = "https://github.com/shin1ohno/herdr-gpui", "rev" = "bf716d8a16ebc88690370726c78430d930f48930" }
"sheprd-core-client" = { "git" = "https://github.com/shin1ohno/herdr-gpui", "rev" = "bf716d8a16ebc88690370726c78430d930f48930" }
"sheprd-backend" = { "git" = "https://github.com/shin1ohno/herdr-gpui", "rev" = "bf716d8a16ebc88690370726c78430d930f48930" }
"sheprd-client" = { "git" = "https://github.com/shin1ohno/herdr-gpui", "rev" = "bf716d8a16ebc88690370726c78430d930f48930" }
"sheprd-credentials" = { "git" = "https://github.com/shin1ohno/herdr-gpui", "rev" = "bf716d8a16ebc88690370726c78430d930f48930" }
"sheprd-commands" = { "git" = "https://github.com/shin1ohno/herdr-gpui", "rev" = "bf716d8a16ebc88690370726c78430d930f48930" }
"sheprd-i18n" = { "git" = "https://github.com/shin1ohno/herdr-gpui", "rev" = "bf716d8a16ebc88690370726c78430d930f48930" }
"sheprd-terminal" = { "git" = "https://github.com/shin1ohno/herdr-gpui", "rev" = "bf716d8a16ebc88690370726c78430d930f48930" }
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
serde_json = "1"
unicode-width = "0.2"
thiserror = "2"
tracing = "0.1"
toml = "1.1.6"

[workspace.lints.rust]
unsafe_code = "deny"
unused_qualifications = "deny"

[workspace.lints.clippy]
expect_used = "deny"
unwrap_used = "deny"

# Keep development artifacts small on the 8 GiB Mac mini.
[profile.dev]
debug = 0
incremental = false
