[workspace]
members = ["crates/yebisu"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.99"
version = "0.1.0"

[workspace.dependencies]
gpui = { package = "gpui-pre", version = "=0.3.12" }
herdr-uikit = { git = "https://github.com/shin1ohno/herdr-uikit", rev = "ee6955c8bd774b4e06f776364f2dc9ae75616af8" }
herdr-ssh = { git = "https://github.com/shin1ohno/herdr-gpui", rev = "398c132a06723a0cc1494842a34666d173ec0200" }
sheprd-core-client = { git = "https://github.com/shin1ohno/herdr-gpui", rev = "398c132a06723a0cc1494842a34666d173ec0200" }
sheprd-backend = { git = "https://github.com/shin1ohno/herdr-gpui", rev = "398c132a06723a0cc1494842a34666d173ec0200" }
sheprd-client = { git = "https://github.com/shin1ohno/herdr-gpui", rev = "398c132a06723a0cc1494842a34666d173ec0200" }
sheprd-commands = { git = "https://github.com/shin1ohno/herdr-gpui", rev = "398c132a06723a0cc1494842a34666d173ec0200" }
sheprd-i18n = { git = "https://github.com/shin1ohno/herdr-gpui", rev = "398c132a06723a0cc1494842a34666d173ec0200" }
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
serde_json = "1"
unicode-width = "0.2"
thiserror = "2"
tracing = "0.1"

[workspace.lints.rust]
unsafe_code = "deny"
unused_qualifications = "deny"

[workspace.lints.clippy]
expect_used = "deny"
unwrap_used = "deny"

# Keep development artifacts small on the 8 GiB Mac mini.
[profile.dev]
debug = 0
incremental = false
