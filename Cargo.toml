[workspace]
members = ["crates/yebisu"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.99"
version = "0.1.1"

[workspace.dependencies]
base64 = "0.23.1"
gpui = { package = "gpui-pre", version = "=0.3.12" }
herdr-uikit = { git = "https://github.com/shin1ohno/herdr-uikit", rev = "8339e132e004a05119e4fddf4fb637b997e4cdcb" }
"herdr-ssh" = { "git" = "https://github.com/shin1ohno/herdr-gpui", "rev" = "c5d57dd395a11d3888fcd4cbddc03bd03fc5cb83" }
"sheprd-core-client" = { "git" = "https://github.com/shin1ohno/herdr-gpui", "rev" = "c5d57dd395a11d3888fcd4cbddc03bd03fc5cb83" }
"sheprd-backend" = { "git" = "https://github.com/shin1ohno/herdr-gpui", "rev" = "c5d57dd395a11d3888fcd4cbddc03bd03fc5cb83" }
"sheprd-client" = { "git" = "https://github.com/shin1ohno/herdr-gpui", "rev" = "c5d57dd395a11d3888fcd4cbddc03bd03fc5cb83" }
"sheprd-credentials" = { "git" = "https://github.com/shin1ohno/herdr-gpui", "rev" = "c5d57dd395a11d3888fcd4cbddc03bd03fc5cb83" }
"sheprd-commands" = { "git" = "https://github.com/shin1ohno/herdr-gpui", "rev" = "c5d57dd395a11d3888fcd4cbddc03bd03fc5cb83" }
"sheprd-i18n" = { "git" = "https://github.com/shin1ohno/herdr-gpui", "rev" = "c5d57dd395a11d3888fcd4cbddc03bd03fc5cb83" }
"sheprd-terminal" = { "git" = "https://github.com/shin1ohno/herdr-gpui", "rev" = "c5d57dd395a11d3888fcd4cbddc03bd03fc5cb83" }
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
serde_json = "1"
unicode-width = "0.2"
thiserror = "2"
tracing = "0.1"
toml = "1.1.6"

[workspace.lints.rust]
unsafe_code = "deny"
unused_qualifications = "deny"

[workspace.lints.clippy]
expect_used = "deny"
unwrap_used = "deny"

# Keep development artifacts small on the 8 GiB Mac mini.
[profile.dev]
debug = 0
incremental = false

# Zed's GPUI as published (gpui-pre 0.3.12, zed@d2a4fb6) plus the changes
# listed in the fork's README: issue #161, touch momentum that ends at the
# edge of its content so the next tap presses; issue #258, no fling against
# a pan's own last movement.
[patch.crates-io]
gpui-pre = { git = "https://github.com/shin1ohno/gpui-pre", rev = "fb53487295ce2034d42db1c8c4c52062c7d9d176" }
